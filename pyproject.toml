[project]
name = "llm-router"
version = "0.1.0"
description = "Capacity-aware, session-sticky load balancing proxy for local LLM backends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
llm-router = "llm_router.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_router"]

[tool.hatch.build.targets.sdist]
# Virtualenvs contain absolute symlinks (bin/python -> /usr/bin/python3), which
# tarfile refuses to archive. Without this, building an sdist in a directory that
# has ever had a venv in it fails with AbsoluteLinkError.
exclude = [
    "/.venv",
    "/.*-venv",
    "/dist",
    "/build",
    "/.pytest_cache",
    "**/__pycache__",
    "*.egg-info",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
